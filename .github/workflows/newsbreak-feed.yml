name: Build NewsBreak feed

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsbreak-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python build_feed.py
        env:
          FEED_OUTPUT: newsbreak.xml
          FEED_URL: https://stopwatchcreative.github.io/yourinfodaily-rss/newsbreak.xml
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add newsbreak.xml
          git diff --cached --quiet || (git commit -m "Update NewsBreak feed" && git pull --rebase && git push)
