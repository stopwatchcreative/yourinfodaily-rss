name: Update YourInfoDaily RSS Feed

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate_feed.py
      - .github/workflows/update-feed.yml

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        run: python generate_feed.py

      - name: Commit updated feed
        run: |
          if [[ -z "$(git status --porcelain feed.xml)" ]]; then
            echo "No changes to feed.xml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Update RSS feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in 15s..."
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "Push failed after 3 attempts"
          exit 1
